<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusiones - Sorteo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/exclusiones.css">
</head>
<body>

    <div class="card">
        <h2>Restricciones</h2>
        <p>Selecciona quién <strong>no</strong> puede regalarle a quién.</p>

        <div id="liveAlertPlaceholder"></div>

        <div class="exclusion-form">
            <div class="select-row">
                <select id="persona-a" class="select-custom">
                    <option value="" disabled selected>Persona A</option>
                </select>
                
                <span class="no-regala">  </span>

                <select id="persona-b" class="select-custom">
                    <option value="" disabled selected>Persona B</option>
                </select>
            </div>

            <button type="button" id="btn-agregar-exclusion" class="btn-secundario">+ Añadir Restricción</button>
            
            <hr class="separator">

            <button type="button" id="btn-continuar" class="btn-primary">Continuar al Sorteo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/exclusiones.js"></script>
</body>
</html>
