<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultado del Sorteo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/resultado.css">
</head>
<body>

<div class="container py-5" style="max-width: 680px;">

    <div class="text-center mb-4">
        <h1 class="titulo-principal">
            <i class="bi bi-gift me-2"></i>Resultados del Sorteo
        </h1>
        <p class="text-secondary small">EventosPerrones!</p>
    </div>

    <!-- Datos del evento -->
    <div class="card casino-card mb-4">
        <div class="card-body">
            <h4 class="card-title section-title">
                <i class="bi bi-calendar-event me-2"></i>Datos del Evento
            </h4>
            <hr class="separator">
            <ul class="list-group list-group-flush casino-list">
                <li class="list-group-item d-flex align-items-center gap-3">
                    <span class="dato-label">Organizador</span>
                    <strong id="organizador">—</strong>
                </li>
                <li class="list-group-item d-flex align-items-center gap-3">
                    <span class="dato-label">Celebración</span>
                    <strong id="celebracion">—</strong>
                </li>
                <li class="list-group-item d-flex align-items-center gap-3">
                    <span class="dato-label">Fecha</span>
                    <strong id="fecha">—</strong>
                </li>
                <li class="list-group-item d-flex align-items-center gap-3">
                    <span class="dato-label">Presupuesto</span>
                    <strong id="gasto">—</strong>
                </li>
            </ul>
        </div>
    </div>

    <!-- Participantes -->
    <div class="card casino-card mb-4">
        <div class="card-body">
            <h4 class="card-title section-title">
                <i class="bi bi-people me-2"></i>Participantes
            </h4>
            <hr class="separator">
            <ul id="listaParticipantes" class="list-group list-group-flush casino-list"></ul>
        </div>
    </div>

    <!-- Exclusiones -->
    <div class="card casino-card mb-4">
        <div class="card-body">
            <h4 class="card-title section-title">
                <i class="bi bi-slash-circle me-2"></i>Exclusiones
            </h4>
            <hr class="separator">
            <ul id="listaExclusiones" class="list-group list-group-flush casino-list"></ul>
        </div>
    </div>

    <!-- Resultado -->
    <div class="card casino-card mb-4">
        <div class="card-body">
            <h4 class="card-title section-title">
                <i class="bi bi-shuffle me-2"></i>Resultado del Sorteo
            </h4>
            <hr class="separator">
            <div class="table-responsive">
                <table class="table table-hover align-middle tabla-casino">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Persona</th>
                            <th>Le regala a</th>
                        </tr>
                    </thead>
                    <tbody id="tablaResultados"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Botón -->
    <div class="d-grid mb-5">
        <button id="btnLimpiar" class="btn btn-danger btn-lg btn-casino">
            <i class="bi bi-arrow-counterclockwise me-2"></i>Realizar otro Sorteo
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/resultado.js"></script>
</body>
</html>
